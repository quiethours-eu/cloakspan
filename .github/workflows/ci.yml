name: ci

# Release engineering for the security gateway, per plan Phase 6.
#
# Two things this workflow is deliberately strict about:
#
# 1. **The gates run on every PR, not only on tags.** A gate that first runs at
#    release time is a gate that blocks a release, which is when there is least
#    appetite to respect it.
# 2. **Nothing is `continue-on-error`.** A scanner that is allowed to fail is a
#    scanner nobody reads. Findings are triaged in
#    deployment/security-exceptions.yaml, with an owner and an expiry — not by
#    letting the step go green.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


env:
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: "v0.1.0-alpha.1"
  RELEASE_VERSION: "0.1.0a1"

jobs:
  test:
    name: test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: lint
        run: |
          python -m ruff check conftest.py gateway recognizers tests evals scripts
          python -m ruff format --check conftest.py gateway recognizers tests evals scripts
      - name: tests
        run: python -m pytest tests evals -q
      - name: installed wheel smoke test
        shell: bash
        run: |
          wheel_dir="$(mktemp -d)"
          venv_dir="$(mktemp -d)"
          work_dir="$(mktemp -d)"
          python -m pip wheel . --no-deps --wheel-dir "$wheel_dir"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install "$wheel_dir"/secure_ai_gateway-*.whl
          cd "$work_dir"
          export SAG_VAULT_KEY=wheel-smoke-vault-root-secret-0000000000000000
          export SAG_TOKEN_KEY=wheel-smoke-token-root-secret-0000000000000000
          # GDPR mode must start from a pip install with no file outside the
          # wheel. An IP literal: no DNS lookup and no connection at startup.
          export SAG_LOCAL_ROUTING=all
          export SAG_LOCAL_BASE_URL=http://127.0.0.1:11434/v1
          unset PYTHONPATH
          "$venv_dir/bin/python" - <<'PY'
          import sys
          from pathlib import Path

          from gateway.config import Settings
          import gateway.main

          policy_path = Settings().policy_path.resolve()
          assert Path(sys.prefix).resolve() in policy_path.parents, policy_path
          assert policy_path.is_file(), policy_path
          assert gateway.main.build() is not None
          assert gateway.main.app.state.pipeline._policy.version.endswith("+local-routing:all")
          PY
      - name: offline demo
        run: python scripts/demo.py

      # Availability rather than performance: fails if the health check is
      # starved while a request is inspected, which is what happens when the
      # CPU work moves back onto the event loop. The budget is a tripwire set
      # well above any healthy value, so a busy runner does not fail the build.
      - name: concurrency and event-loop responsiveness
        run: python scripts/benchmark_concurrency.py

  # Quality is measured on every change, and reported even when it fails, so a
  # regression is visible in the PR rather than at the next manual run.
  detection-quality:
    name: detection quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: corpus reproduces byte-for-byte
        run: |
          python -m evals.datasets.generate
          git diff --exit-code evals/datasets \
            || (echo "::error::the committed corpus does not match the generator" && exit 1)
      - name: evals
        # `--no-gate` so this job always publishes the full table, including a
        # regression, rather than aborting at the first failing pair. The gate
        # itself lives in the test job, via
        # evals/test_detection_baseline.py::test_no_new_failing_pairs -- so this
        # step reports, and that job blocks.
        run: python -m evals.run_evals --split dev --json evals-report.json --no-gate
      - uses: actions/upload-artifact@v7
        with:
          name: evals-report
          path: evals-report.json

  package:
    name: installable package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "build>=1.2,<2.0"
      - name: build wheel from the source distribution
        run: python -m build
      - name: verify both packages outside the checkout
        run: python scripts/smoke_package.py dist
      - name: prepare downloadable files and checksums
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp deployment/requirements-runtime.lock dist/
          cd dist
          sha256sum *.whl *.tar.gz requirements-runtime.lock > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: python-distributions
          path: dist/

  supply-chain:
    name: SBOM, licences, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"

      - name: licence policy
        run: python scripts/supply_chain.py check

      - name: source SBOM
        run: |
          mkdir -p dist
          python scripts/supply_chain.py sbom --output dist/sbom.cdx.json
          python scripts/supply_chain.py licences --output dist/licence-report.json

      - name: validate vulnerability exceptions
        run: python scripts/vulnerability_policy.py

      # pip-audit reports no severity: keep all findings blocking rather than
      # risk applying a HIGH exception to a CRITICAL vulnerability.
      - name: dependency vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --strict --desc --requirement deployment/requirements.lock \
            --format json --output dist/pip-audit.json
          pip-audit --strict --desc --require-hashes \
            --requirement deployment/requirements-runtime.lock \
            --format json --output dist/pip-audit-runtime.json

      - name: committed secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect \
            --source . --config .gitleaks.toml --redact --no-banner

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supply-chain
          path: dist/

  container:
    name: container build and hardening
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"

      - name: read the pinned base image
        id: base
        run: |
          source deployment/docker/base-image.env
          echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"

      # Releases must not build against a mutable tag: a tag names different
      # bytes over time, so the SBOM would describe an artefact that no longer
      # exists. Branch builds may use the tag.
      - name: release builds require a pinned base image
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/pin_base_image.py --check

      - name: build
        run: |
          REF="${{ steps.base.outputs.image }}"
          if [ -n "${{ steps.base.outputs.digest }}" ]; then
            REF="${{ steps.base.outputs.image }}@${{ steps.base.outputs.digest }}"
          fi
          docker build -f deployment/docker/Dockerfile \
            --build-arg BASE_REF="$REF" -t secure-ai-gateway:ci .

      # The evidence an assessor asks to see reproduced: non-root uid, read-only
      # root filesystem, dropped capabilities, and zero canary occurrences in the
      # full log stream.
      - name: container hardening tests
        env:
          SAG_TEST_IMAGE: secure-ai-gateway:ci
        run: python -m pytest tests/test_container_hardening.py -m container -q

      - name: prepare evidence directory
        run: mkdir -p dist

      - name: container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: secure-ai-gateway:ci
          format: cyclonedx-json
          output-file: dist/sbom-image.cdx.json
          upload-artifact: false

      - name: image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-ai-gateway:ci
          format: json
          output: dist/trivy.json
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: enforce image vulnerability policy
        run: python scripts/vulnerability_policy.py dist/trivy.json

      - name: preserve the exact tested image for publication
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save secure-ai-gateway:ci | gzip > "$RUNNER_TEMP/release-image.tar.gz"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image.tar.gz

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-evidence
          path: dist/

  draft-release:
    name: prepare alpha draft
    needs: [test, detection-quality, supply-chain, container, package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: alpha-release-draft
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: create or refresh an unpublished prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c 'import os, tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["RELEASE_VERSION"]'
          # A slower, older build must not replace a newer draft.
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; leaving its draft untouched."
            exit 0
          fi
          state="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")"
          if [ "$state" = false ]; then
            echo "The release is already published; leaving it untouched."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cp "docs/releases/$RELEASE_TAG.md" "$notes"
          cat >> "$notes" <<EOF

          Prepared from commit [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA).
          [Validation run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          EOF
          if [ "$state" = true ]; then
            gh release edit "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Cloakspan $RELEASE_TAG" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --draft --prerelease \
              --target "$GITHUB_SHA" --title "Cloakspan $RELEASE_TAG" --notes-file "$notes"
          fi

  release:
    name: sign, attest, and publish alpha
    needs: [test, detection-quality, supply-chain, container, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: enforce the first-alpha publication gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          test -s "docs/releases/$RELEASE_TAG-staging.md" || {
            echo "::error::The required staging rehearsal report is missing."
            exit 1
          }
          if grep -q '^\*\*Draft: not published\.' "docs/releases/$RELEASE_TAG.md"; then
            echo "::error::Release notes still mark this alpha as blocked."
            exit 1
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - uses: actions/download-artifact@v4
        with:
          name: release-image
          path: ${{ runner.temp }}/release-image
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push the exact tested release image
        id: push
        run: |
          TAG="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
          docker load --input "$RUNNER_TEMP/release-image/release-image.tar.gz"
          docker tag secure-ai-gateway:ci "$TAG"
          docker push "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      # Keyless: the signature is bound to this workflow's OIDC identity, so a
      # verifier can check *what built it*, not just that something signed it.
      - name: sign
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${{ steps.push.outputs.tag }}@${{ steps.push.outputs.digest }}"

      - name: build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: verification instructions
        run: |
          echo "cosign verify ${{ steps.push.outputs.tag }} \\"
          echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' \\"
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"

      - name: publish the GitHub prerelease after signing and attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease \
            --notes-file "docs/releases/$RELEASE_TAG.md"
