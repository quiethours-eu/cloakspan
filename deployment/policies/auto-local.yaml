# Auto-local policy: personal data goes to your own model.
#
# For deployments where personal data must not reach a third-party model in any
# form, tokens included. Credentials are blocked, a request with any detected
# personal data goes to the `local` destination, and only requests in which
# nothing was detected reach `external`.
#
# Routing is only as complete as detection. PERSON, ORG, LOCATION, and ADDRESS
# need an operator-supplied NER model (SAG_NER_MODEL_PATH). Without one, a
# request whose only personal detail is a name is treated as clean. To keep
# every request local regardless of detection, mount a copy of this file with
# the last rule's destination set to `local` and point SAG_POLICY_PATH at it.
#
# default_destination is `local`, so a filter from SAG_FILTERS_PATH or an added
# rule that names no destination stays local as well. Entity types defined with
# the legacy SAG_CUSTOM_PATTERNS setting have no rule here, so a request whose
# only match is one of them still goes to `external`. Move those patterns into
# a filters file to keep them local.
#
# Select it with SAG_POLICY_PATH. In production the gateway refuses to start
# unless both SAG_LOCAL_BASE_URL and SAG_EXTERNAL_BASE_URL are configured. If
# the local model is unreachable, its requests fail; they are never retried
# against the external provider.

version: auto-local-v1
default_destination: local

rules:
  # ---- 100: credentials never leave, in any form ----
  - name: block-secrets
    priority: 100
    match:
      entities:
        - AWS_ACCESS_KEY
        - PRIVATE_KEY
        - JWT
        - OPENAI_API_KEY
        - ANTHROPIC_API_KEY
        - GITHUB_TOKEN
        - SLACK_TOKEN
    action:
      type: block

  # ---- 90: anything personal stays on your own infrastructure ----
  # Every non-secret entity type in docs/entity-taxonomy.md, with no min_score:
  # a doubtful match costs a local answer, not a disclosure. ORG, LOCATION, and
  # IP_ADDRESS are included because this policy errs toward local; remove them
  # if too much ordinary traffic ends up on the local model.
  - name: personal-data-local
    priority: 90
    match:
      entities:
        - PERSON
        - ORG
        - LOCATION
        - ADDRESS
        - EMAIL_ADDRESS
        - PHONE_NUMBER
        - IP_ADDRESS
        - IBAN
        - PAYMENT_CARD
        - LV_PERSONAL_CODE
        - LT_PERSONAL_CODE
        - EE_PERSONAL_CODE
        - BALTIC_PERSONAL_CODE
        - CUSTOMER_TERM
    action:
      type: route_local
      destination: local

  # ---- 10: catch-all. Nothing was detected, so the external model answers ----
  - name: clean-requests-external
    priority: 10
    action:
      type: allow
      destination: external
