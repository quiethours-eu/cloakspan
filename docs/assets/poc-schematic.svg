<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cloakspan proof-of-concept request path</title>
  <desc id="desc">A conventional engineering flow diagram showing a client request entering a customer-controlled gateway, policy decisions, scoped tokenization, local encrypted storage, external or local model routing, response buffering, request provenance checks, and restoration.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#333333"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#246b9a"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#777777"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Tahoma, sans-serif; fill: #161616; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #555555; }
      .lane { font-size: 15px; font-weight: 700; letter-spacing: .35px; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-copy { font-size: 14px; fill: #333333; }
      .code { font-family: Consolas, "Liberation Mono", monospace; font-size: 14px; }
      .edge-label { font-size: 12px; font-weight: 700; fill: #444444; }
      .note { font-size: 13px; fill: #555555; }
      .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
      .edge { fill: none; stroke: #333333; stroke-width: 1.6; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #246b9a; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .edge-gray { fill: none; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
      .data-link { fill: none; stroke: #246b9a; stroke-width: 1.4; stroke-dasharray: 2 5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="40" y="48" class="title">Cloakspan — proof-of-concept request path</text>
  <text x="40" y="78" class="subtitle">Synthetic example · POST /v1/chat/completions · solid blue line marks the demonstrated transform path</text>
  <path d="M40 102H1560" stroke="#b8b8b8"/>

  <rect x="40" y="130" width="240" height="690" fill="#fafafa" stroke="#8b8b8b" stroke-width="1.3"/>
  <rect x="310" y="130" width="920" height="690" fill="#ffffff" stroke="#246b9a" stroke-width="2" stroke-dasharray="9 6"/>
  <rect x="1260" y="130" width="300" height="690" fill="#fafafa" stroke="#8b8b8b" stroke-width="1.3"/>
  <path d="M40 175H280M310 175H1230M1260 175H1560" stroke="#b8b8b8"/>
  <text x="160" y="158" text-anchor="middle" class="lane">UNTRUSTED CLIENT</text>
  <text x="330" y="158" class="lane" fill="#246b9a">CUSTOMER ENVIRONMENT — LOCAL TRUST BOUNDARY</text>
  <text x="1410" y="158" text-anchor="middle" class="lane">EXTERNAL PROVIDER</text>

  <path d="M790 235V202H1410V235" class="edge-gray"/>
  <rect x="1020" y="188" width="170" height="22" fill="#ffffff"/>
  <text x="1105" y="203" text-anchor="middle" class="edge-label">ALLOW · UNCHANGED</text>

  <path d="M255 283H350" class="edge"/>
  <path d="M490 283H530" class="edge"/>
  <path d="M680 283H720" class="edge"/>
  <path d="M860 283H900" class="edge-blue"/>
  <path d="M1060 283H1300" class="edge-blue"/>
  <text x="290" y="272" class="edge-label">HTTPS</text>
  <text x="1135" y="270" class="edge-label" fill="#246b9a">TRANSFORM</text>

  <rect x="65" y="235" width="190" height="95" class="box"/>
  <text x="80" y="258" class="node-title">Request</text>
  <text x="80" y="281" class="code">Draft a reply to</text>
  <text x="80" y="301" class="code" fill="#246b9a">alex@example.com</text>
  <text x="80" y="321" class="code">about the invoice.</text>

  <rect x="350" y="235" width="140" height="95" class="box"/>
  <text x="420" y="274" text-anchor="middle" class="node-title">API ingress</text>
  <text x="420" y="298" text-anchor="middle" class="node-copy">authenticate</text>

  <rect x="530" y="235" width="150" height="95" class="box"/>
  <text x="605" y="268" text-anchor="middle" class="node-title">Inspect</text>
  <text x="605" y="292" text-anchor="middle" class="node-copy">detect + normalize</text>
  <text x="605" y="314" text-anchor="middle" class="code" fill="#246b9a">EMAIL_ADDRESS × 1</text>

  <path d="M790 235L860 283L790 330L720 283Z" fill="#fff9e8" stroke="#715b1b" stroke-width="1.5"/>
  <text x="790" y="278" text-anchor="middle" class="node-title">Policy</text>
  <text x="790" y="298" text-anchor="middle" class="node-copy">decision</text>

  <rect x="900" y="235" width="160" height="95" class="box"/>
  <text x="980" y="274" text-anchor="middle" class="node-title">Tokenize</text>
  <text x="980" y="298" text-anchor="middle" class="node-copy">scoped HMAC tag</text>

  <rect x="1300" y="235" width="220" height="95" class="box"/>
  <text x="1410" y="258" text-anchor="middle" class="node-title">External model</text>
  <text x="1410" y="283" text-anchor="middle" class="code" fill="#246b9a">&lt;EMAIL_ADDRESS:v1:</text>
  <text x="1410" y="303" text-anchor="middle" class="code" fill="#246b9a">69b4f8e1…&gt;</text>
  <text x="1410" y="322" text-anchor="middle" class="node-copy">raw email absent</text>

  <path d="M790 330V430" class="edge"/>
  <text x="800" y="380" class="edge-label" fill="#a32922">BLOCK</text>
  <rect x="720" y="430" width="140" height="74" fill="#fff0ef" stroke="#a32922" stroke-width="1.5"/>
  <text x="790" y="460" text-anchor="middle" class="node-title" fill="#a32922">Stop request</text>
  <text x="790" y="484" text-anchor="middle" class="node-copy">provider not called</text>

  <path d="M980 330V430" class="edge-blue"/>
  <text x="992" y="382" class="edge-label" fill="#246b9a">ROUTE_LOCAL</text>
  <rect x="900" y="430" width="160" height="74" class="box"/>
  <text x="980" y="460" text-anchor="middle" class="node-title">Local model</text>
  <text x="980" y="484" text-anchor="middle" class="node-copy">customer controlled</text>

  <path d="M1060 310H1120V567H1080" class="data-link"/>
  <path d="M880 540C880 529 925 522 980 522C1035 522 1080 529 1080 540V598C1080 609 1035 616 980 616C925 616 880 609 880 598Z" fill="#eef6fb" stroke="#246b9a" stroke-width="1.5"/>
  <ellipse cx="980" cy="540" rx="100" ry="18" fill="#f6fbfe" stroke="#246b9a" stroke-width="1.5"/>
  <text x="980" y="567" text-anchor="middle" class="node-title">Encrypted mapping vault</text>
  <text x="980" y="592" text-anchor="middle" class="node-copy">AES-256-GCM · local only</text>

  <path d="M1410 330V690H1190" class="edge"/>
  <path d="M1040 690H950" class="edge"/>
  <path d="M770 690H740" class="edge-blue"/>
  <path d="M590 690H255" class="edge-blue"/>
  <text x="1210" y="677" class="edge-label">MODEL RESPONSE</text>
  <text x="745" y="677" class="edge-label" fill="#246b9a">YES</text>
  <text x="397" y="677" class="edge-label" fill="#246b9a">RESTORED RESPONSE</text>

  <rect x="1040" y="650" width="150" height="80" class="box"/>
  <text x="1115" y="683" text-anchor="middle" class="node-title">Buffer</text>
  <text x="1115" y="707" text-anchor="middle" class="node-copy">full response</text>

  <path d="M860 635L950 690L860 745L770 690Z" fill="#fff9e8" stroke="#715b1b" stroke-width="1.5"/>
  <text x="860" y="684" text-anchor="middle" class="node-title">Request-minted</text>
  <text x="860" y="707" text-anchor="middle" class="node-copy">+ scope match?</text>

  <rect x="590" y="650" width="150" height="80" class="box"/>
  <text x="665" y="683" text-anchor="middle" class="node-title">Restore</text>
  <text x="665" y="707" text-anchor="middle" class="node-copy">approved fields only</text>

  <rect x="65" y="650" width="190" height="80" class="box"/>
  <text x="80" y="679" class="node-title">Client receives</text>
  <text x="80" y="706" class="code" fill="#246b9a">alex@example.com</text>

  <path d="M880 570H665V650" class="data-link"/>
  <text x="706" y="560" class="note" fill="#246b9a">scoped mapping lookup</text>
  <path d="M860 745V775" fill="none" stroke="#a32922" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="872" y="765" class="edge-label" fill="#a32922">NO</text>
  <rect x="735" y="775" width="250" height="45" fill="#fff0ef" stroke="#a32922" stroke-width="1.5"/>
  <text x="860" y="795" text-anchor="middle" class="node-title" fill="#a32922">Leave token opaque</text>
  <text x="860" y="814" text-anchor="middle" class="node-copy">restored 0 · refused 1</text>

  <line x1="40" y1="860" x2="92" y2="860" stroke="#246b9a" stroke-width="2.2"/>
  <text x="102" y="865" class="note">demonstrated transform path</text>
  <line x1="318" y1="860" x2="370" y2="860" stroke="#777777" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="380" y="865" class="note">alternative policy route</text>
  <line x1="570" y1="860" x2="622" y2="860" stroke="#246b9a" stroke-width="1.4" stroke-dasharray="2 5"/>
  <text x="632" y="865" class="note">local data lookup</text>
</svg>
